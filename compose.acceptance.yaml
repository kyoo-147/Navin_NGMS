# Navin W03 — ISOLATED disposable acceptance environment.
#
# This file is intentionally separate from the production `compose.yaml`.
# It is never merged with production configuration and never reads the
# production `.env`. Every resource it creates is namespaced `navin-acceptance`
# and every published port is bound to 127.0.0.1 on a non-production port.
#
# Run it only through tests/acceptance/environment/*.sh (which enforce the
# production guard and pass the acceptance env file):
#
#   docker compose --project-name navin-acceptance \
#     --env-file tests/acceptance/environment/acceptance.env \
#     -f compose.acceptance.yaml up -d
#
# Production engine: ${NAVIN_ACCEPTANCE_STALWART_IMAGE} is pinned by version AND digest.

name: navin-acceptance

services:
  stalwart:
    image: ${NAVIN_ACCEPTANCE_STALWART_IMAGE:-stalwartlabs/stalwart:v0.16.24@sha256:ec011be228596e37e65f41aab17deed573859614430472f7eeb42178c50d87b7}
    container_name: navin-acceptance-stalwart
    restart: 'no'
    labels:
      com.navin.acceptance: 'true'
      com.navin.environment: 'acceptance'
    environment:
      STALWART_PUBLIC_URL: 'http://${NAVIN_ACCEPTANCE_MAIL_HOSTNAME:-mail.company.test}'
      NAVIN_ENVIRONMENT: 'acceptance'
      TZ: 'UTC'
    ports:
      - '127.0.0.1:${NAVIN_ACCEPTANCE_SMTP_PORT:-10025}:25'
      - '127.0.0.1:${NAVIN_ACCEPTANCE_SUBMISSION_PORT:-10587}:587'
      - '127.0.0.1:${NAVIN_ACCEPTANCE_IMAP_PORT:-10143}:143'
      - '127.0.0.1:${NAVIN_ACCEPTANCE_IMAPS_PORT:-10993}:993'
      - '127.0.0.1:${NAVIN_ACCEPTANCE_HTTP_PORT:-18080}:8080'
    volumes:
      - acceptance-stalwart-etc:/etc/stalwart
      - acceptance-stalwart-lib:/var/lib/stalwart
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      acceptance:
        aliases:
          - stalwart
          - '${NAVIN_ACCEPTANCE_MAIL_HOSTNAME:-mail.company.test}'

networks:
  acceptance:
    name: navin-acceptance

volumes:
  acceptance-stalwart-etc:
    name: navin-acceptance-stalwart-etc
  acceptance-stalwart-lib:
    name: navin-acceptance-stalwart-lib
